<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16204a"/>
      <stop offset="1" stop-color="#0b1024"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a4a7a"/>
      <stop offset="1" stop-color="#20305e"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" fill="url(#bg)"/>
  <!-- antenna -->
  <line x1="50" y1="18" x2="50" y2="30" stroke="#34d8f1" stroke-width="3" stroke-linecap="round"/>
  <circle cx="50" cy="15" r="4" fill="#34d8f1"/>
  <!-- head -->
  <rect x="27" y="30" width="46" height="40" rx="10" fill="url(#head)" stroke="#4d8dff" stroke-width="2"/>
  <!-- eyes -->
  <circle cx="40" cy="47" r="6" fill="#34d8f1"/>
  <circle cx="60" cy="47" r="6" fill="#34d8f1"/>
  <circle cx="40" cy="47" r="2.5" fill="#0b1024"/>
  <circle cx="60" cy="47" r="2.5" fill="#0b1024"/>
  <!-- mouth -->
  <rect x="38" y="58" width="24" height="5" rx="2.5" fill="#2e7df6"/>
  <!-- ears -->
  <rect x="21" y="44" width="6" height="12" rx="3" fill="#4d8dff"/>
  <rect x="73" y="44" width="6" height="12" rx="3" fill="#4d8dff"/>
</svg>
